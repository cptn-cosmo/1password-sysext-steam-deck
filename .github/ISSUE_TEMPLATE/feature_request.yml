name: Feature request
description: Suggest an improvement to the setup script or the 1Password integration on the Steam Deck
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! Please check the [existing issues](https://github.com/cptn-cosmo/1password-sysext-steam-deck/issues) first.

        Feature requests for 1Password itself are better sent to [1Password](https://1password.community/).
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what is missing or hard about it today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like it to work?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Any workarounds or other approaches you have considered.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links, screenshots, or anything else that helps.
